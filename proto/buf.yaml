version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  ignore_only:
    # Connect is a bidi stream of shared oneof envelopes (AgentMessage /
    # ServerMessage), not a unary request/response pair.
    RPC_REQUEST_STANDARD_NAME:
      - modelhub/v1/node.proto
    RPC_RESPONSE_STANDARD_NAME:
      - modelhub/v1/node.proto
breaking:
  use: [FILE]
