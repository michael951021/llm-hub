name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: modelhub_owner
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: modelhub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U modelhub_owner -d modelhub"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://modelhub_app:devpassword@localhost:5433/modelhub
      DATABASE_OWNER_URL: postgres://modelhub_owner:devpassword@localhost:5433/modelhub
      REDIS_URL: redis://localhost:6380
      PUBLIC_URL: http://localhost:5173
      PORT: 3000
      AGENT_PORT: 3001
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      PAIRING_CODE_PEPPER: ci-secret-fedcba9876543210fedcba9876543210
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # The e2e suite (part of `pnpm test`) builds and runs the Go agent.
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modelhub/db migrate
      - run: pnpm typecheck
      # Includes the e2e suite, which is just another workspace package.
      - run: pnpm test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cd agent && go vet ./... && go test ./... -race

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # buf breaking diffs against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # buf is a root devDependency, not a marketplace action.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec buf lint proto
      # Stops a PR from breaking wire compatibility with deployed agents.
      - if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking proto --against ".git#branch=origin/${{ github.base_ref }},subdir=proto"
